<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña - Wallaclone</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .caja {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 320px;
            text-align: center;
        }

        h1 {
            color: #13c1ac;
            margin-top: 0;
            font-size: 22px;
        }

        p.descripcion {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #13c1ac;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        #mensaje {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }

        a {
            color: #13c1ac;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="caja">
        <h1>¿Olvidaste tu contraseña?</h1>
        <p class="descripcion">Introduce tu email y te enviaremos un enlace para restablecer tu contraseña.</p>

        <form id="form-recuperar">
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <button type="submit">Enviar enlace</button>
        </form>

        <p id="mensaje"></p>
        <br>
        <a href="/login.html">Volver al login</a>
    </div>

    <script>
        document.getElementById('form-recuperar').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const cajaMensaje = document.getElementById('mensaje');

            cajaMensaje.textContent = 'Enviando...';
            cajaMensaje.style.color = 'black';

            try {
                const respuesta = await fetch('/recuperar-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    cajaMensaje.textContent = datos.mensaje;
                    cajaMensaje.style.color = 'green';
                    document.getElementById('form-recuperar').reset();
                } else {
                    cajaMensaje.textContent = datos.error;
                    cajaMensaje.style.color = 'red';
                }
            } catch (error) {
                cajaMensaje.textContent = 'Error de conexión con el servidor.';
                cajaMensaje.style.color = 'red';
            }
        });
    </script>

</body>

</html>
