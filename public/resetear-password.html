<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Nueva contraseña - Wallaclone</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .caja {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 320px;
            text-align: center;
        }

        h1 {
            color: #13c1ac;
            margin-top: 0;
            font-size: 22px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #13c1ac;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        #mensaje {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }

        a {
            color: #13c1ac;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="caja">
        <h1>Crear nueva contraseña</h1>

        <form id="form-resetear">
            <input type="password" id="password" placeholder="Nueva contraseña" required>
            <input type="password" id="password-confirm" placeholder="Confirmar contraseña" required>
            <button type="submit">Guardar contraseña</button>
        </form>

        <p id="mensaje"></p>
        <br>
        <a href="/login.html">Volver al login</a>
    </div>

    <script>
        // Leemos el token de la URL: /resetear-password.html?token=XXX
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('mensaje').textContent = 'Enlace no válido. Solicita uno nuevo.';
            document.getElementById('mensaje').style.color = 'red';
            document.getElementById('form-resetear').style.display = 'none';
        }

        document.getElementById('form-resetear').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password-confirm').value;
            const cajaMensaje = document.getElementById('mensaje');

            if (password !== passwordConfirm) {
                cajaMensaje.textContent = 'Las contraseñas no coinciden.';
                cajaMensaje.style.color = 'red';
                return;
            }

            cajaMensaje.textContent = 'Guardando...';
            cajaMensaje.style.color = 'black';

            try {
                const respuesta = await fetch(`/resetear-password/${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    cajaMensaje.textContent = datos.mensaje;
                    cajaMensaje.style.color = 'green';
                    document.getElementById('form-resetear').style.display = 'none';
                    setTimeout(() => window.location.href = '/login.html', 2500);
                } else {
                    cajaMensaje.textContent = datos.error;
                    cajaMensaje.style.color = 'red';
                }
            } catch (error) {
                cajaMensaje.textContent = 'Error de conexión con el servidor.';
                cajaMensaje.style.color = 'red';
            }
        });
    </script>

</body>

</html>
