<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro - Wallaclone</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e0f7f4 0%, #f5f5f5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .caja-registro {
            background: white;
            padding: 40px 36px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            width: 360px;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #13c1ac;
            letter-spacing: -1px;
            margin-bottom: 4px;
        }

        .subtitulo {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 4px;
            margin-top: 14px;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e5e5e5;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            background: #fafafa;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #13c1ac;
            background: white;
            box-shadow: 0 0 0 3px rgba(19,193,172,0.12);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #13c1ac;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            margin-top: 22px;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover { background: #0e9e8e; }
        button:active { transform: scale(0.98); }

        #mensaje {
            margin-top: 14px;
            font-weight: 600;
            font-size: 14px;
        }

        .enlaces {
            margin-top: 22px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .enlaces a {
            color: #13c1ac;
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
        }

        .enlaces a:hover { text-decoration: underline; }

        .separador {
            border: none;
            border-top: 1px solid #f0f0f0;
            margin: 20px 0 0;
        }
    </style>
</head>

<body>

    <div class="caja-registro">
        <div class="logo">🛍️ Wallaclone</div>
        <p class="subtitulo">Crea tu cuenta gratis</p>
        <form id="form-registro">
            <label for="username">Nombre de usuario</label>
            <input type="text" id="username" placeholder="Elige un nombre de usuario" required>
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="tu@email.com" required>
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
            <button type="submit">Crear cuenta</button>
        </form>
        <p id="mensaje"></p>
        <hr class="separador">
        <div class="enlaces">
            <a href="/login.html">¿Ya tienes cuenta? Inicia sesión</a>
            <a href="/">← Volver al inicio</a>
        </div>
    </div>

    <script>
        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página recargue

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const cajaMensaje = document.getElementById('mensaje');

            cajaMensaje.textContent = "Procesando...";
            cajaMensaje.style.color = "black";

            try {
                // Enviamos los datos a nuestro servidor
                const respuesta = await fetch('http://localhost:3000/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    cajaMensaje.textContent = datos.mensaje;
                    cajaMensaje.style.color = "green";
                    document.getElementById('form-registro').reset(); // Limpiamos el formulario
                } else {
                    cajaMensaje.textContent = datos.error;
                    cajaMensaje.style.color = "red";
                }
            } catch (error) {
                cajaMensaje.textContent = "Error de conexión con el servidor.";
                cajaMensaje.style.color = "red";
            }
        });
    </script>

</body>

</html>
